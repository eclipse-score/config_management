name: Code Coverage
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - name: Apply OSS-only patches
        # TEMPORARY WORKAROUND (patch): score/config_management/** is synced from an internal source and cannot be
        # edited directly from OSS. bazel/patches/001-adapt-proxy-api-and-remove-internal-targets.patch adds
        # lifecycle/health deps not yet available via sync and drops internal-only (non-OSS) targets. The
        # --check guard makes this a no-op once the change lands via sync.
        run: |
          git apply --check bazel/patches/001-adapt-proxy-api-and-remove-internal-targets.patch 2>/dev/null && \
            git apply bazel/patches/001-adapt-proxy-api-and-remove-internal-targets.patch || true
      - name: Run Bazel Coverage
        run: |
          bazel coverage \
            --config=host_gcc \
            --test_tag_filters=-mw_com \
            //score/config_management/... \
            -- \
            -//score/config_management/config_provider:unit_tests_host \
            -//score/config_management/config_provider/code/config_provider:unit_tests_host \
            -//score/config_management/config_provider/code/config_provider/details/... \
            -//score/config_management/config_provider/code/config_provider/factory/... \
            -//score/config_management/config_provider:config_provider_mw_com \
            -//score/config_management/dependability/... \
            //score/config_management/config_provider/code/config_provider/error/... \
            //score/config_management/config_provider/code/parameter_set/... \
            //score/config_management/config_provider/code/persistency/... \
            //score/config_management/config_provider/code/proxies/...
      - name: Generate HTML Coverage Report
        run: |
          genhtml "$(bazel info output_path)/_coverage/_coverage_report.dat" \
            -o=cpp_coverage \
            --show-details \
            --source-directory="$(bazel info execution_root)" \
            --legend \
            --function-coverage \
            --branch-coverage
        shell: bash
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report
          path: cpp_coverage/
          include-hidden-files: true
          retention-days: 10

name: QNX Build & Test
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:
jobs:
  qnx-build:
    name: Build and Test ${{ matrix.bazel-config }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bazel-config: x86_64-qnx
          - bazel-config: arm64-qnx
            extra-bazel-test-flags: "--test_timeout=120,600,1800,7200"
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@5d0175286293af3d26617db2422ee5267c4dda9a # main branch (2026-10-28)
    permissions:
      contents: read
      pull-requests: read
    with:
      # Build everything below //score/config_management/... (as logging and communication do). A target
      # which cannot be built for QNX declares target_compatible_with = ["@platforms//os:linux"], Bazel
      # then skips it.
      bazel-target: >-
        //score/config_management/... //tests/cpp/... -//score/config_management/dependability/...
      bazel-config: ${{ matrix.bazel-config }}
      # Unit tests are selected by Bazel itself: every cc_test tagged `unit` (cc_unit_test and
      # cc_gtest_unit_test add the tag) below //score/config_management/... plus the //tests/cpp smoke
      # test. Added or removed tests are picked up from the BUILD files of the PR itself; there is no
      # test list to maintain here. A test which cannot run on QNX declares
      # target_compatible_with = ["@platforms//os:linux"] in its BUILD target, Bazel then skips it.
      # .github/tools/check_qnx_unit_test_selection.sh (run by test.yml) fails when a cc_test lacks the
      # `unit` tag and would therefore silently never run on QNX.
      bazel-test-target: >-
        //score/config_management/... //tests/cpp/... -//score/config_management/dependability/...
      extra-bazel-test-flags: --build_tests_only --test_tag_filters=unit ${{ matrix.extra-bazel-test-flags }}
      credential-helper: "scripts/internal/qnx_creds.py"
      bazel-disk-cache: ${{ matrix.bazel-config }}
      # Both matrix legs download the QNX SDP from qnx.com at once; default 3x30s retries were not enough.
      fetch-attempts: 5
      fetch-retry-delay: 120
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}


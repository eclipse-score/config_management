name: QNX Build & Test
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:
jobs:
  qnx-build:
    name: Build and Test ${{ matrix.bazel-config }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bazel-config: x86_64-qnx
          - bazel-config: arm64-qnx
            extra-bazel-test-flags: "--test_timeout=120,600,1800,7200"
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@5d0175286293af3d26617db2422ee5267c4dda9a # main branch (2026-10-28)
    permissions:
      contents: read
      pull-requests: read
    with:
      # Build targets: same wildcard/exclusion query as test.yml (see that file
      # for why known-broken targets are excluded), restricted to
      # //score/config_management/... plus the //tests/cpp smoke test.
      bazel-target: >-
        //score/config_management/config_daemon:clang_tidy_extra_checks //score/config_management/config_daemon/code:is_score_variant //score/config_management/config_daemon/code:score_variant //score/config_management/config_daemon/code/app:interface //score/config_management/config_daemon/code/app:mock //score/config_management/config_daemon/code/app:unit_tests_host //score/config_management/config_daemon/code/app/details:app //score/config_management/config_daemon/code/app/details:app_for_unit_test //score/config_management/config_daemon/code/app/details:unit_test //score/config_management/config_daemon/code/data_model:parameter_set_qualifier //score/config_management/config_daemon/code/data_model:parameterset_collection //score/config_management/config_daemon/code/data_model:parameterset_collection_manager //score/config_management/config_daemon/code/data_model:parameterset_collection_manager_mock //score/config_management/config_daemon/code/data_model:parameterset_collection_mock //score/config_management/config_daemon/code/data_model:unit_tests_host //score/config_management/config_daemon/code/data_model/details:parameterset_collection_impl //score/config_management/config_daemon/code/data_model/details:parameterset_collection_manager_impl //score/config_management/config_daemon/code/data_model/details:unit_test //score/config_management/config_daemon/code/data_model/details:unit_test_manager //score/config_management/config_daemon/code/data_model/error:error //score/config_management/config_daemon/code/data_model/error:unit_test //score/config_management/config_daemon/code/data_model/parameter_set_storage:mock //score/config_management/config_daemon/code/data_model/parameter_set_storage:parameter_set_storage //score/config_management/config_daemon/code/data_model/parameter_set_storage:unit_tests_host //score/config_management/config_daemon/code/data_model/parameter_set_storage/details:details_score //score/config_management/config_daemon/code/data_model/parameter_set_storage/details:details_score_for_unit_test //score/config_management/config_daemon/code/data_model/parameter_set_storage/details:unit_test //score/config_management/config_daemon/code/data_model/parameter_set_storage/details:unit_test_score //score/config_management/config_daemon/code/data_model/parameter_set_storage/details/score_kvs_stub:score_kvs_mock //score/config_management/config_daemon/code/data_model/parameter_set_storage/details/score_kvs_stub:score_kvs_stub //score/config_management/config_daemon/code/data_model/parameter_set_storage/error:error //score/config_management/config_daemon/code/data_model/parameter_set_storage/error:unit_test //score/config_management/config_daemon/code/data_model/parameterset_collection_interfaces:read_only_parameterset_collection //score/config_management/config_daemon/code/data_model/parameterset_collection_interfaces:read_only_parameterset_collection_mock //score/config_management/config_daemon/code/factory:interface //score/config_management/config_daemon/code/factory:interface_for_unit_test //score/config_management/config_daemon/code/factory:mock //score/config_management/config_daemon/code/factory/details:factory_mw_com //score/config_management/config_daemon/code/factory/details:factory_mw_com_for_unit_test //score/config_management/config_daemon/code/fault_event_reporter:fault_event_reporter //score/config_management/config_daemon/code/fault_event_reporter:fault_event_score_types //score/config_management/config_daemon/code/fault_event_reporter:fault_event_types //score/config_management/config_daemon/code/fault_event_reporter:mock //score/config_management/config_daemon/code/fault_event_reporter:unit_tests_host //score/config_management/config_daemon/code/fault_event_reporter/details:details_score_impl //score/config_management/config_daemon/code/fault_event_reporter/details:details_score_impl_for_test //score/config_management/config_daemon/code/fault_event_reporter/details:score_impl_unit_test //score/config_management/config_daemon/code/json_helper:json_helper //score/config_management/config_daemon/code/json_helper:mock //score/config_management/config_daemon/code/json_helper/details:details //score/config_management/config_daemon/code/plugins:mock //score/config_management/config_daemon/code/plugins:plugin //score/config_management/config_daemon/code/plugins:plugin_creator //score/config_management/config_daemon/code/plugins:plugin_creator_mock //score/config_management/config_daemon/code/plugins:unit_tests_host //score/config_management/config_daemon/code/plugins/demo_json:demo_parameters //score/config_management/config_daemon/code/plugins/demo_json:unit_tests_host //score/config_management/config_daemon/code/plugins/demo_json/details:demo_json_plugin_impl //score/config_management/config_daemon/code/plugins/demo_json/details:demo_json_plugin_impl_test //score/config_management/config_daemon/code/plugins/demo_json/details:unit_tests_host //score/config_management/config_daemon/code/plugins/demo_json/parameter_loader:demo_parameter_loader //score/config_management/config_daemon/code/plugins/demo_json/parameter_loader/details:demo_parameter_loader_impl //score/config_management/config_daemon/code/plugins/demo_json/parameter_loader/details:demo_parameter_loader_impl_test //score/config_management/config_daemon/code/plugins/demo_json/parameter_loader/details:unit_tests_host //score/config_management/config_daemon/code/plugins/demo_json/plugin_creator:demo_json_plugin_creator //score/config_management/config_daemon/code/plugins/demo_json/plugin_creator:demo_json_plugin_creator_test //score/config_management/config_daemon/code/plugins/demo_json/plugin_creator:unit_tests_host //score/config_management/config_daemon/code/plugins/plugin_collector:interface //score/config_management/config_daemon/code/plugins/plugin_collector:mock //score/config_management/config_daemon/code/plugins/plugin_collector:unit_tests_host //score/config_management/config_daemon/code/plugins/plugin_collector/details:details //score/config_management/config_daemon/code/plugins/plugin_collector/details:details_for_unit_test //score/config_management/config_daemon/code/plugins/plugin_collector/details:unit_test //score/config_management/config_daemon/code/services:internal_config_provider_reactor //score/config_management/config_daemon/code/services:internal_config_provider_reactor_mock //score/config_management/config_daemon/code/services:mock //score/config_management/config_daemon/code/services:services //score/config_management/config_daemon/code/services:unit_tests_host //score/config_management/config_daemon/code/services/details:details_impl //score/config_management/config_daemon/code/services/details:for_unit_test //score/config_management/config_daemon/code/services/details:unit_test //score/config_management/config_daemon/code/services/details/mw_com:details_mw_com_impl //score/config_management/config_daemon/code/services/details/mw_com:details_mw_com_test //score/config_management/config_daemon/config:mw_com_config //score/config_management/config_daemon/code/services/details/mw_com:unit_test //score/config_management/lib/mw_com_types:internal_config_provider_type //score/config_management/config_daemon/code/types/initial_qualifier_state:initial_qualifier_state //score/config_management/config_provider/code/config_provider:config_provider //score/config_management/config_provider/code/config_provider:config_provider_mock //score/config_management/config_provider/code/config_provider:initial_qualifier_state_types //score/config_management/config_provider/code/config_provider/error:error //score/config_management/config_provider/code/config_provider/error:unit_test //score/config_management/config_provider/code/config_provider/error:unit_tests_host //score/config_management/config_provider/code/parameter_set:parameter_set //score/config_management/config_provider/code/parameter_set:unit_test //score/config_management/config_provider/code/parameter_set:unit_tests_host //score/config_management/config_provider/code/persistency:mock //score/config_management/config_provider/code/persistency:persistency //score/config_management/config_provider/code/persistency:unit_tests_host //score/config_management/config_provider/code/persistency/details:details //score/config_management/config_provider/code/persistency/details:unit_test //score/config_management/config_provider/code/persistency/error:error //score/config_management/config_provider/code/persistency/error:unit_test //score/config_management/config_provider/code/proxies:internal_config_provider //score/config_management/config_provider/code/proxies:mock //score/config_management/config_provider/code/proxies:unit_tests_host //score/config_management/config_provider/code/proxies/details:details_mw_com //score/config_management/config_provider/code/proxies/details:test_mw_com_config //score/config_management/config_provider/code/proxies/details:unit_test_mw //score/config_management/lib/mw_com_types:runtime_sized_array //tests/cpp:cpp_test_main
      bazel-config: ${{ matrix.bazel-config }}
      # Unit tests are selected by Bazel itself: every cc_test tagged `unit` (cc_unit_test and
      # cc_gtest_unit_test add the tag) below //score/config_management/... plus the //tests/cpp smoke
      # test. Added or removed tests are picked up from the BUILD files of the PR itself; there is no
      # test list to maintain here. A test which cannot run on QNX declares
      # target_compatible_with = ["@platforms//os:linux"] in its BUILD target, Bazel then skips it.
      # .github/tools/check_qnx_unit_test_selection.sh (run by test.yml) fails when a cc_test lacks the
      # `unit` tag and would therefore silently never run on QNX.
      bazel-test-target: >-
        //score/config_management/... //tests/cpp/...
        -//score/config_management/dependability/...
      extra-bazel-test-flags: --build_tests_only --test_tag_filters=unit ${{ matrix.extra-bazel-test-flags }}
      credential-helper: "scripts/internal/qnx_creds.py"
      bazel-disk-cache: ${{ matrix.bazel-config }}
      # Both matrix legs download the QNX SDP from qnx.com at once; default 3x30s retries were not enough.
      fetch-attempts: 5
      fetch-retry-delay: 120
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}

